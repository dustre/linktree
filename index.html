<style>
  :root {
    --ink:     #232328;
    --paper:   #F5F6F7;
    --surface: #FFFFFF;
    --line:    #E1E4E7;
    --muted:   #6C727A;
    --cyan:    #00C0D5;

    --body: 'Inter Tight', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;

    /* canto chanfrado — as peças da página são "cortadas", como chapa usinada */
    --cut: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 2.25rem 1rem;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* estrias finas: metal escovado sob o conteúdo */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: repeating-linear-gradient(90deg,
      rgba(35,35,40,.028) 0 1px, transparent 1px 4px);
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 26rem;
  }

  /* ── cabeçalho: as duas marcas lado a lado ── */
  header { text-align: center; margin-bottom: 2.25rem; }

  .brands {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(.9rem, 4vw, 1.4rem);
    margin-bottom: 1rem;
  }

  .brands img {
    height: clamp(30px, 8.5vw, 40px);
    width: auto;
    display: block;
  }

  .brands .sep {
    width: 1px;
    align-self: stretch;
    background: var(--line);
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: .66rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    padding-left: .28em;
  }

  .rule {
    width: 34px;
    height: 3px;
    background: var(--cyan);
    border: 0;
    margin: 1.1rem auto 0;
  }

  /* ── links ── */
  .links {
    list-style: none;
    margin: 0 0 2.25rem;
    padding: 0;
    display: grid;
    gap: .6rem;
  }

  /* moldura de 1px: vira ciano no hover/toque */
  .plate {
    display: block;
    padding: 1px;
    background: var(--line);
    clip-path: var(--cut);
    text-decoration: none;
    color: inherit;
    transition: background .22s;
  }

  .face {
    position: relative;
    display: flex;
    align-items: center;
    gap: .8rem;
    min-height: 54px;
    padding: .9rem 1rem;
    background: var(--surface);
    clip-path: var(--cut);
  }

  /* barra que sobe na borda esquerda */
  .face::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--cyan);
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform .28s cubic-bezier(.2,.7,.3,1);
  }

  .plate:hover,
  .plate:active { background: var(--cyan); }
  .plate:hover .face::before,
  .plate:active .face::before,
  .plate:focus-visible .face::before { transform: scaleY(1); }

  .plate:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
    background: var(--cyan);
  }

  .face svg {
    flex: none;
    width: 18px;
    height: 18px;
    fill: var(--ink);
  }

  .label { font-weight: 500; }

  .meta {
    margin-left: auto;
    font-family: var(--mono);
    font-size: .68rem;
    color: var(--muted);
    white-space: nowrap;
    max-width: 55%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  footer {
    font-family: var(--mono);
    font-size: .66rem;
    letter-spacing: .1em;
    color: #9AA0A7;
    text-align: center;
  }

  @media (max-width: 350px) {
    .meta { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .face::before { transition: none; }
  }
</style>
